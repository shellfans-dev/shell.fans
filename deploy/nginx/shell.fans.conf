# Nginx site config for shell.fans (landing / marketing site)
#
# TLS: Cloudflare Origin Certificate (Full strict mode)
#   - Origin cert & key: /etc/nginx/ssl/shell.fans.{crt,key}
#   - Cloudflare SSL/TLS mode: Full (strict)
#   - Browser → Cloudflare: Cloudflare Universal SSL (automatic)
#   - Cloudflare → Origin: Origin Certificate (trusted by CF)
#
# Install:
#   sudo cp deploy/nginx/shell.fans.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/shell.fans.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ---------------------------------------------------------------------------
# 內容協商用的 map（必須在 server 之外，http context）
#
# 為什麼用 map 而不是 location 裡的 if：
#   nginx 的 `if` 在 location 內是出了名的不可靠（IfIsEvil），對 try_files
#   這類 rewrite-phase 指令尤其容易產生非預期行為。map 在請求開始時求值一次，
#   結果只是個變數，可以安全地餵給 try_files。
# ---------------------------------------------------------------------------

# Accept 標頭要 markdown 時，讓 try_files 先試 .md 版本。
# 只認完整的 text/markdown —— 不比對裸 "markdown"，避免誤判。
map $http_accept $md_suffix {
    default                 "";
    "~*\btext/markdown\b"   ".md";
}

# 首頁的 $uri 是 "/"，直接接 .md 會變成 "/.md"（dotfile，且被 deny 規則擋掉）。
# 映射成 /index 讓它去試 /index.md。
map $uri $md_base {
    default   $uri;
    "/"       "/index";
}

# 404 也做內容協商：機器導向的請求給結構化、可自行復原的回應，
# 內含 sitemap / llms.txt / developers 的指引，而不是一頁人類看的 HTML。
# 瀏覽器送的 Accept 以 text/html 開頭且不含 application/json，會落在 default。
map $http_accept $notfound_doc {
    default                   "/404.html";
    "~*\bapplication/json\b"  "/404.json";
    "~*\btext/markdown\b"     "/404.md";
}

# --- HTTP :80 — redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name shell.fans www.shell.fans;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        return 301 https://shell.fans$request_uri;
    }
}

# --- Redirect www → apex ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.shell.fans;

    ssl_certificate     /etc/nginx/ssl/shell.fans.crt;
    ssl_certificate_key /etc/nginx/ssl/shell.fans.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://shell.fans$request_uri;
}

# --- HTTPS :443 — main site ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shell.fans;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    # TLS — Cloudflare Origin Certificate
    ssl_certificate     /etc/nginx/ssl/shell.fans.crt;
    ssl_certificate_key /etc/nginx/ssl/shell.fans.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/shell.fans;
    index index.html;
    charset utf-8;

    # ⚠ include 這一行不能刪。
    #
    # nginx 內建 mime.types 沒有 .md。下方 location ~* \.md$ 用 default_type
    # 解決了「直接請求 .md 網址」的情況，但 Markdown 內容協商是靠 try_files
    # 在 location / 內部解析到 .md 檔——那條路徑不會進入 .md 的 location，
    # 因此仍會拿到 application/octet-stream。
    #
    # types 的繼承規則是「跨 context 取代、同 context 追加」。單獨寫一個
    # types { text/markdown md; } 會把從 http context 繼承來的整份 MIME 表
    # 換掉，結果是除了 .md 之外所有檔案（含全部 HTML）都變成
    # application/octet-stream——配上 nosniff 就是整站變成下載而非顯示。
    # 先在同一 context include 完整表、再追加一筆，才是正確寫法。
    include /etc/nginx/mime.types;
    types {
        text/markdown  md;
    }

    # charset 指令只作用於 charset_types 清單內的型別。這裡是 nginx 預設清單
    # 再加 text/markdown——少了它，協商回傳的 Markdown 不會帶 charset=utf-8，
    # 中文內容在部分客戶端會亂碼。刻意不加 text/css（維持現狀無 charset）。
    charset_types text/html text/xml text/plain text/vnd.wap.wml application/javascript application/rss+xml text/markdown;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://kol.fans https://www.kol.fans;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 封鎖所有 dotfile(.env / .env.* / .git/ / .htaccess ...)，保留 .well-known(ACME 憑證需要)。
    # regex location 優先於 prefix location，會在 try_files 服務靜態檔前先攔截。
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Admin console — rewrite /_adm-712 → /adm712, proxy to Next.js
    location /_adm-712 {
        rewrite ^/_adm-712(.*)$ /adm712$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Also serve /adm712 directly (for internal redirects)
    location /adm712 {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # Hide internal rewrite headers from client
        proxy_hide_header x-middleware-rewrite;
    }

    # Admin API routes
    location /api/adm712 {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dify proxy (shellfans-api Bun service)
    # SunPay 金流 webhook — SunPay 後台已將 NotifyURL 改為 shell.fans；但 handler 在
    # saas_womm（coder1bot，僅 kol.fans tunnel 可達），故 exact-match 代理到 kol.fans handler。
    # 待 kol.fans → shell.fans 整併完成後改指新 origin。
    location = /api/webhooks/payment/sunpay {
        # 用變數讓 nginx 延到「請求時」才解析這個外部域名。直接把域名寫在
        # proxy_pass 會讓它變成啟動期就必須解析成功的 upstream —— 2026-08-01
        # 06:24 nginx 重啟時正是因為此處解析不到而 [emerg] 拒絕啟動，整站 521
        # 掛了兩天。resolver 指向 systemd-resolved。
        resolver 127.0.0.53 valid=30s;
        set $sunpay_origin "console.shell.fans";
        proxy_pass https://$sunpay_origin/api/webhooks/payment/sunpay;
        proxy_ssl_server_name on;
        proxy_set_header Host console.shell.fans;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 公開 API v1 —— shellfans-api 的 /v1/*
    #
    # 為什麼要有這條：先前公開端點散在兩個網域（shell.fans 的 /api/dify/*
    # 與 console.shell.fans 的 /api/site/*），OpenAPI 靠 operation-level
    # servers 描述。但那個欄位在工具鏈裡支援度很差——掃描器與多數 LLM
    # function-calling 轉換器直接取頂層 servers[0]，於是六個操作有四個會
    # 打到 https://shell.fans/api/site/… 拿到 404。收斂到單一主機、單一
    # 版本前綴之後，照 OpenAPI 產生的工具定義才會全部可用。
    #
    # proxy_pass 結尾的 / 會把 /api/v1/services 改寫成 /v1/services。
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3081/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        # 速率限制與 CORS 由上游決定，這裡不要重複加 add_header——
        # nginx 的 add_header 不是附加而是覆蓋整組，會把上游的
        # RateLimit-* 與 Access-Control-* 一起蓋掉。
    }

    location /api/dify/ {
        proxy_pass http://127.0.0.1:3081/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Next.js assets needed by admin pages
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /index.html is no longer the canonical homepage entry.
    # Use $request_uri (the original client URI) so internal rewrites
    # from `/` -> index.html do not get caught and cause a loop.
    if ($request_uri ~ "^/index\.html(\?.*)?$") {
        return 301 https://shell.fans/;
    }

    # HTML pages — short cache, revalidate
    # Redirect legacy /sentiment-analysis -> /fans-analysis (2026-04-20)
    # 慣用網址別名 → 實際頁面。
    # 這些路徑先前落到 @home_redirect（302 導首頁），改成真 404 之後就成了
    # 死路。但 /privacy、/terms、/about 是外部系統與 agent 最常直接嘗試的
    # 慣用位置——與其讓它們 404，不如 301 到真正的頁面。
    # /about 有自己的實體頁，不在此列。
    location = /privacy { return 301 https://shell.fans/privacy-policy; }
    location = /terms   { return 301 https://shell.fans/terms-and-conditions; }
    location = /docs    { return 301 https://shell.fans/developers; }

    # OpenAPI 描述檔。下方的 json 規則是 expires 90d + immutable，那對會隨
    # 端點調整而更新的規格檔是錯的——會讓客戶端拿著三個月前的舊版本。
    location = /openapi.json {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    location = /sentiment-analysis { return 301 https://shell.fans/fans-analysis; }
    location = /sentiment-analysis.html { return 301 https://shell.fans/fans-analysis; }
    location = /kol-engine { return 301 https://shell.fans/endurance; }
    location = /kol-engine.html { return 301 https://shell.fans/endurance; }

    # Internal OG-sync webhook (kol.fans admin auto-trigger)
    location = /_internal/sync-og {
        proxy_pass http://127.0.0.1:18901/sync-og;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 100k;
    }

    # /aeo-geo keeps serving aeo-geo.html even though an /aeo-geo/ directory now
    # exists (methodology, taiwan-aeo-tools). Without this exact match the generic
    # `try_files $uri $uri/ $uri.html` below would match the directory via $uri/ and
    # 301 to /aeo-geo/, changing the page's canonical URL. Sub-pages such as
    # /aeo-geo/methodology still resolve through `location /` via $uri.html.
    # NOTE: add_header is NOT additive in nginx — a location with its own add_header
    # discards inherited ones, so the full header set is repeated here.
    location = /aeo-geo {
        # /aeo-geo.md 存在，這裡也要支援 Markdown 協商，否則同一個站上會有
        # 「大部分頁面認 Accept、這一頁不認」的不一致行為。
        try_files /aeo-geo$md_suffix /aeo-geo.html =404;
        gzip_vary off;
        add_header Vary "Accept, Accept-Encoding" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://kol.fans https://www.kol.fans;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        # 順序：Markdown 協商 → 實體檔 → 扁平網址 → 404
        #
        # $md_base$md_suffix
        #   Accept 沒要 markdown 時 $md_suffix 為空，這一項退化成 $md_base
        #   （首頁是 /index，其餘等於 $uri），命不中就往下走，無副作用。
        #
        # $uri.html 必須排在實體檔之後、目錄之前。當 foo.html 與 foo/ 目錄同時
        # 存在時（/aeo-geo、/aeo 皆是），先試目錄會命中沒有 index.html 的目錄。
        #
        # 用 $uri/index.html 而不是 $uri/：後者會把 /aeo/ 這種帶斜線的請求交給
        # 沒有 index.html 的目錄，回 403 Forbidden——對 agent 而言 403 意味
        # 「存在但你沒權限」，是錯誤訊號，應該是 404「不存在」。
        # 但也不能直接刪掉這一項：首頁 "/" 正是靠它解析到 index.html，
        # 拿掉會讓首頁變成 404。指名 index.html 兩個需求同時滿足。
        #
        # =404 取代先前的 @home_redirect（302 導回首頁）。舊行為讓任何錯字、
        # 失效連結、探測路徑都回 200-ish 的首頁，agent 無法區分「頁面存在」與
        # 「頁面不存在」，也讓 sitemap 之外的網址看起來全部有效。
        # 改動前查過 access log：12,173 次 302 之中，扣掉漏洞掃描器後沒有任何
        # 正當流量（唯一有 referer 的是 /js/sf-footer.js.map，devtools 抓
        # source map，本來就該 404）。
        try_files $md_base$md_suffix $uri $uri.html $uri/index.html =404;

        # Vary: Accept —— 同一個網址會依 Accept 回 HTML 或 Markdown，
        # 沒有這個標頭，中介快取會把其中一種餵給另一種請求。
        # 與 gzip_vary 產生的 Accept-Encoding 合併成單一標頭，避免重複。
        gzip_vary off;
        add_header Vary "Accept, Accept-Encoding" always;
        # HTML pages: force browser AND Cloudflare to revalidate every request.
        # nginx still emits ETag/Last-Modified so 304s remain cheap. CDN-Cache-Control
        # is honored by Cloudflare specifically and tells the edge not to cache HTML.
        # Static assets (css/js/img) keep their own immutable location blocks below.
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://kol.fans https://www.kol.fans;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # -----------------------------------------------------------------------
    # 404 的機器可讀變體
    #
    # internal —— 只能由 error_page 的內部轉址抵達，不能直接請求。
    # 直接開放 /404.json 會讓它變成一個「回 200 的錯誤文件」，反而製造
    # 新的假訊號。
    #
    # 不快取：錯誤回應被 CDN 或瀏覽器快取後，之後該網址真的上線了也還是 404。
    # -----------------------------------------------------------------------
    location = /404.json {
        internal;
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /404.md {
        internal;
        default_type text/markdown;
        charset_types text/markdown;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------------------------------------------------------------------
    # Markdown alternate（給 AI agent 讀的乾淨版本）
    #
    # nginx 內建 mime.types 沒有 .md，預設會回 application/octet-stream。
    # 配上既有的 nosniff，瀏覽器與多數 bot 會當成二進位下載而不是文字，
    # 等於白做。因此必須顯式指定 text/markdown。
    #
    # X-Robots-Tag: noindex —— .md 與 HTML 是同一份內容，讓搜尋引擎索引
    # 會變成互相競爭的重複頁。刻意**不加** nofollow / noarchive：
    #   nofollow 會讓 .md 內的連結不被跟隨，失去導流到其他主題的作用
    #   noarchive 沒有必要，且部分 AI 檢索會參考快取
    # noindex 只影響「是否列入搜尋結果」，不影響 AI 抓取。
    # ---------------------------------------------------------------------
    location ~* \.md$ {
        default_type text/markdown;
        # charset 指令預設只作用於 text/html、text/plain 等；text/markdown 不在
        # 預設清單裡，必須明確加入，否則中文內容不會帶 charset=utf-8。
        charset_types text/markdown;
        charset utf-8;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # CSS / JS — long cache
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Images / fonts / media — long cache
    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|woff|woff2|ttf|eot|json)$ {
        expires 90d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Documents
    location /documents/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Custom error pages
    # $notfound_doc 依 Accept 選擇 HTML / JSON / Markdown 三種變體（見檔首 map）。
    # error_page 用 URI 形式會保留原本的 404 狀態碼，不會變成 200。
    error_page 404 $notfound_doc;
    error_page 401 /401.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        text/css
        text/plain
        image/svg+xml;

    access_log /var/log/nginx/shell.fans.access.log;
    error_log  /var/log/nginx/shell.fans.error.log warn;
}
